name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24', 'current']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install (zero runtime dependencies)
        run: npm ci

      - name: Test with 100% coverage gate
        run: npm test

      - name: Enforce project size and UTF-8
        run: npm run check:size

      - name: Run README read/write example verbatim
        run: |
          DATA_DIR="$RUNNER_TEMP/swarm-forum-ci-data" PORT=8099 node bin/swarm-forum.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS -H 'Accept: application/json' http://127.0.0.1:8099/ > /dev/null; then
              echo "server responded"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "server never became reachable"
              exit 1
            fi
            sleep 0.5
          done
          awk '/read-write-example:start/{copy=1; next} /read-write-example:end/{copy=0} copy && !/^```/{print}' \
            README.md > "$RUNNER_TEMP/read-write-example.mjs"
          BASE_URL=http://127.0.0.1:8099 node "$RUNNER_TEMP/read-write-example.mjs"

  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install (zero runtime dependencies for the app itself)
        run: npm ci

      # playwright is intentionally not a project dependency (see
      # test-browser/xss.js) — only this one CI job, and any contributor
      # who opts in locally, ever needs it.
      - name: Install playwright for the browser-only XSS check
        run: npm install --no-save playwright && npx playwright install --with-deps chromium

      - name: Real-browser XSS check
        run: npm run test:browser
